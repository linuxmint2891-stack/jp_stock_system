name: 🔄 Sync Yahoo Data Only

on:
  schedule:
    - cron: '0 14 * * *' # 毎日 JST 23:00
  workflow_dispatch:

jobs:
  sync_market_data:
    name: Sync merged market data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          key: yahoo-merged-data

      - name: Prepare Google credentials
        env:
          RAW_SECRET_DATA: ${{ secrets.M_DRIVE_SECRET }}
        run: |
          test -n "$RAW_SECRET_DATA"
          printf '%s' "$RAW_SECRET_DATA" > client_secret.json

      - name: Download merged Parquet
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: cargo run --release --bin download_drive

      - name: Sync market data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: cargo run --release --bin sync_yahoo_actions

      - name: Upload merged Parquet
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: cargo run --release --bin upload_drive

      - name: Cleanup credentials
        if: always()
        run: rm -f client_secret.json

  notify_sync_failure:
    name: Notify sync failure
    needs: sync_market_data
    if: ${{ always() && needs.sync_market_data.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data '{"content":"🚨 市場データ同期に失敗しました。統合Parquetは更新されていないため、AI Scoutは安全のため売買判断を停止します。GitHub Actionsの Sync Yahoo Data Only ログを確認してください。"}' \
              "$DISCORD_WEBHOOK_URL"
          fi
