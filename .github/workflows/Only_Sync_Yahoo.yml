name: 🔄 Sync Yahoo Data Only

on:
  schedule:
    - cron: '0 14 * * *' # 毎日 JST 23:00
  workflow_dispatch:

jobs:
  sync_shard:
    name: Sync ${{ matrix.range }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        range: ["1000-3000", "3001-6000", "6001-9999"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@v2
        with:
          key: yahoo-shard-${{ matrix.range }}

      - name: Prepare Google credentials
        env:
          RAW_SECRET_DATA: ${{ secrets.M_DRIVE_SECRET }}
        run: |
          test -n "$RAW_SECRET_DATA"
          printf '%s' "$RAW_SECRET_DATA" > client_secret.json

      - name: Download or initialize shard
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: |
          if ! cargo run --release --bin download_drive -- --range ${{ matrix.range }}; then
            echo "Shard not found; creating it from the current merged Parquet."
            cargo run --release --bin download_drive
            cargo run --release --bin create_parquet_shard -- --range ${{ matrix.range }}
          fi

      - name: Sync shard data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: cargo run --release --bin sync_yahoo_actions -- --range ${{ matrix.range }}

      - name: Upload shard
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: cargo run --release --bin upload_drive -- --range ${{ matrix.range }}

      - name: Cleanup credentials
        if: always()
        run: rm -f client_secret.json

  merge_shards:
    name: Merge updated shards
    needs: sync_shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@v2
        with:
          key: yahoo-shard-merge

      - name: Prepare Google credentials
        env:
          RAW_SECRET_DATA: ${{ secrets.M_DRIVE_SECRET }}
        run: |
          test -n "$RAW_SECRET_DATA"
          printf '%s' "$RAW_SECRET_DATA" > client_secret.json

      - name: Download all shards
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: |
          for range in 1000-3000 3001-6000 6001-9999; do
            cargo run --release --bin download_drive -- --range "$range"
          done

      - name: Merge shards
        run: cargo run --release --bin merge_parquet_shards

      - name: Publish merged Parquet
        env:
          GDRIVE_SECRET_JSON: client_secret.json
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: cargo run --release --bin upload_drive

      - name: Cleanup credentials
        if: always()
        run: rm -f client_secret.json

  notify_sync_failure:
    name: Notify sync failure
    needs: [sync_shard, merge_shards]
    if: ${{ always() && (needs.sync_shard.result == 'failure' || needs.merge_shards.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data '{"content":"🚨 市場データ同期に失敗しました。統合Parquetは更新されていないため、AI Scoutは安全のため売買判断を停止します。GitHub Actionsの Sync Yahoo Data Only ログを確認してください。"}' \
              "$DISCORD_WEBHOOK_URL"
          fi
