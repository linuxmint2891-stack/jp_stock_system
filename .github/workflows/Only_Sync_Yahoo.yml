name: 🔄 Sync Yahoo Data Only

on:
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2

      # 🔑 1. サービスアカウントJSONの書き出し（テストで成功した手順）
      - name: 🔑 Prepare Google Credentials
        env:
          RAW_SECRET_DATA: ${{ secrets.M_DRIVE_SECRET }}
        run: |
          if [ -z "$RAW_SECRET_DATA" ]; then
            echo "❌ Error: M_DRIVE_SECRET is not set"
            exit 1
          fi
          echo "$RAW_SECRET_DATA" > client_secret.json
          if [[ $(head -c 1 client_secret.json) != "{" ]]; then
            echo "❌ Error: client_secret.json looks invalid"
            exit 1
          fi

      # 📥 2. まず現在のベースラインを落とす
      - name: 📥 Download baseline from Google Drive
        env:
          GDRIVE_SECRET_JSON: "client_secret.json"
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: |
          cargo run --release --bin download_drive

      # 🚀 3. 差分同期を実行
      - name: 🚀 Run GitHub Actions sync module
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          cargo run --release --bin sync_yahoo_actions

      # 📤 4. 同期した最新データをDriveへ書き戻す
      - name: 📤 Upload updated data to Google Drive
        env:
          GDRIVE_SECRET_JSON: "client_secret.json"
          GDRIVE_UPLOAD_FOLDER_ID: ${{ secrets.GDRIVE_UPLOAD_FOLDER_ID }}
        run: |
          cargo run --release --bin upload_drive

      # 🧹 5. クリーンアップ（一時作成したクレデンシャルを安全に削除）
      - name: 🧹 Cleanup Credentials
        if: always()
        run: |
          rm -f client_secret.json
